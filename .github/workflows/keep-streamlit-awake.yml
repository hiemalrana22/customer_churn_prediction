name: Keep Streamlit app awake

# curl / UptimeRobot HTTP checks get 200 from the sleep page and do NOT wake the app.
# This job opens a real Chromium session (Playwright), clicks the wake button if
# needed, and fails if the app is still asleep — so green means actually awake.

on:
  schedule:
    # Community Cloud sleeps after ~12h without a real browser session.
    # Every 2h stays well inside that window even if GitHub cron runs late.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install --disable-pip-version-check playwright
          playwright install chromium --with-deps

      - name: Wake Streamlit app
        run: >
          python scripts/keep_streamlit_awake.py
          --url https://customerchurnprediction-wrdtyrnpxtw6p4crk8ownm.streamlit.app/
          --hold-seconds 60
